name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: a pull request's code can't write to the repo through CI.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # No macOS: hosted macOS runners often sit at capacity, and this plain-Node
        # code behaves the same there as on Linux.
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The action checks this repo's own skill, the way a user's workflow would.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          path: skills
          strict: true
